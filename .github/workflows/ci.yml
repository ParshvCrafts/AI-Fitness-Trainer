name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pytest==8.3.4
      - run: pytest -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ai-fitness-trainer .
      - name: Container serves the page
        run: |
          docker run -d --name app -p 5000:5000 ai-fitness-trainer
          for i in $(seq 1 30); do curl -fsS http://localhost:5000/ -o /dev/null && exit 0; sleep 2; done
          docker logs app; exit 1
